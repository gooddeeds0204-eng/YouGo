name: Publish YouGo Web Preview

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yougo-web-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Configure portable SPA preview
        run: |
          node <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo.web = { ...(app.expo.web || {}), output: 'single' };
          app.expo.experiments = {
            ...(app.expo.experiments || {}),
            baseUrl: '/gooddeeds0204-eng/YouGo/preview'
          };
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
          NODE

      - name: Export Expo web preview
        run: npx expo export --platform web --output-dir dist

      - name: Make raw.githack index path router-safe
        run: |
          cat > dist/route-fix.js <<'EOF'
          (function () {
            var base = '/gooddeeds0204-eng/YouGo/preview/';
            if (location.pathname !== base) {
              history.replaceState(null, '', base);
            }
          })();
          EOF

          node <<'NODE'
          const fs = require('fs');
          const file = 'dist/index.html';
          let html = fs.readFileSync(file, 'utf8');
          const tag = '<script src="/gooddeeds0204-eng/YouGo/preview/route-fix.js"></script>';
          html = html.replace('<head>', '<head>' + tag);
          fs.writeFileSync(file, html);
          NODE

      - name: Publish preview branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: preview
          publish_dir: ./dist
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "Publish YouGo app preview"
