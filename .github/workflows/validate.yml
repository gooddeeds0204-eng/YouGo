name: Validate YouGo Mobile

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Validate Expo config
        run: npx expo config --type public

      - name: Verify modular architecture
        run: |
          test -s src/app/_layout.tsx
          test -s src/features/room/shell/RoomShell.tsx
          test -s src/registries/gameRegistry.ts
          test -s src/registries/giftRegistry.ts
          test -s src/config/roomLevels.ts
