name: Validate YouGo Prototype

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check required app files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s manifest.webmanifest
          test -s assets/yougo-logo.svg
      - name: Verify core feature markers
        run: |
          grep -q "Voice" index.html
          grep -q "Video" index.html
          grep -q "Game" index.html
          grep -q "Lucky Pocket" index.html
          grep -q "Room PK" index.html
          grep -q "Couple Space" app.js
          grep -q "Profile Photo Wall" app.js
          grep -q "SVIP" app.js
